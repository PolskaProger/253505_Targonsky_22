{% extends 'layout.html' %}

{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/main/news_detail.css' %}">
<title>{{ news_item.title }}</title>
{% endblock %}

{% block main %}
<article>
    <h1>{{ news_item.title }}</h1>
    <img src="{{ news_item.photo.url }}" width="500em" height="300em">
    <p>{{ news_item.description }}</p>
</article>
<div class="parent">
    <a href="{% url 'main:news' %}" class="back">Назад к новостям</a>
</div>
{% endblock %}
